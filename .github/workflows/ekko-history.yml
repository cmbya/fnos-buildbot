name: Inspect Ekko history bundle

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ekko-history.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official npm bundle without installing or running it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, tarfile, urllib.error, urllib.request
          version = '0.8.16'
          with urllib.request.urlopen('https://registry.npmjs.org/ekko-studio/' + version, timeout=60) as r:
              info = json.load(r)
          with urllib.request.urlopen(info['dist']['tarball'], timeout=120) as r:
              data = r.read()
          integrity = 'sha512-' + base64.b64encode(hashlib.sha512(data).digest()).decode()
          assert integrity == info['dist']['integrity'], 'npm integrity mismatch'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              text = archive.extractfile('package/dist/server/index.js').read().decode()
          def region(start, end):
              assert text.count(start) == 1 and text.count(end) == 1, (start, end)
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]
          history = region('function wWr(', 'var R$=')
          parser = region('function Jts(', 'var YWr=')
          truncation = region('function x_(', 'function Jts(')
          projection_start = text.index('function P0e(')
          projection = text[projection_start:text.index('var ', projection_start)]
          # Include the runtime initializer immediately following the facade.
          projection += text[text.index('var ', projection_start):text.index('function ', text.index('var ', projection_start))]
          report = {'version': version, 'integrity': integrity, 'bundle_sha256': hashlib.sha256(text.encode()).hexdigest(), 'history_sha256': hashlib.sha256(history.encode()).hexdigest(), 'history': history, 'parser': parser, 'truncation': truncation, 'projection': projection}
          for name in ['P0e', 'wWr', 'Mrt', 'W8e']:
              report[name + '_declarations'] = len(re.findall(r'function ' + re.escape(name) + r'\(', text))
          path = 'docs/ekko-history-0.8.16-inspection.txt'
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/contents/' + path
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as r:
              sha = json.load(r)['sha']
          body = {'message': 'chore(ekko): record exact cloud-reviewed 0.8.16 history regions', 'content': base64.b64encode((json.dumps(report, ensure_ascii=False, indent=2) + '\n').encode()).decode(), 'branch': 'main', 'sha': sha}
          with urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(body).encode(), headers=headers, method='PUT'), timeout=60) as r:
              result = json.load(r)
          print('Inspection commit:', result['commit']['sha'])
          print('History SHA256:', report['history_sha256'])
          PY
