name: Verify and release Ekko history fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ekko-history.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-build
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.config.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Patch guards and actual npm history function regressions
        run: python3 scripts/test_ekko_patch.py
      - name: Pin repaired version
        id: config
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          app = next(a for a in json.loads(Path('apps.json').read_text())['apps'] if a['id'] == 'ekko')
          app.update(version='0.8.16', tag='0.8.16')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('app=' + json.dumps(app, separators=(',', ':')) + '\n')
          PY
  build:
    needs: regression
    uses: ./.github/workflows/build-app.yml
    with:
      app: ${{ needs.regression.outputs.app }}
  publish:
    needs: [regression, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fpk-ekko
          path: artifacts
      - name: Publish only the verified Ekko package and refresh FnDepot
        env:
          GH_TOKEN: ${{ secrets.FNDEPOT_TOKEN }}
        run: |
          set -euo pipefail
          fpk=artifacts/Ekko-0.8.16-x86.fpk
          test -s "$fpk"
          sha256sum "$fpk"
          TAG="$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          if gh release view "$TAG" --repo cmbya/FnDepot >/dev/null 2>&1; then
            gh release upload "$TAG" "$fpk" --repo cmbya/FnDepot --clobber
          else
            gh release create "$TAG" "$fpk" --repo cmbya/FnDepot --title "fnOS 应用构建 $TAG" --notes 'Actions 构建 Ekko 0.8.16；已完成隔离回归，未完成真实 fnOS 安装升级验收。'
          fi
          gh release view "$TAG" --repo cmbya/FnDepot --json assets > release-assets.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          file = Path('artifacts/Ekko-0.8.16-x86.fpk')
          asset = next(a for a in json.loads(Path('release-assets.json').read_text())['assets'] if a['name'] == file.name)
          assert asset['size'] == file.stat().st_size
          digest = asset.get('digest')
          if digest:
              assert digest == 'sha256:' + hashlib.sha256(file.read_bytes()).hexdigest()
          print('Published asset verified:', asset['url'])
          PY
          gh api --method POST repos/cmbya/FnDepot/dispatches -f event_type=refresh-index || gh workflow run update-fndepot.yml --repo cmbya/FnDepot
      - name: Save verified cloud delivery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/record_ekko_ci.py
  report-failure:
    needs: [regression, build, publish]
    if: ${{ always() && (needs.regression.result == 'failure' || needs.build.result == 'failure' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Save bounded failure evidence for remote inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/record_ekko_ci.py --failure
