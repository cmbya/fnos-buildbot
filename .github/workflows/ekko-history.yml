name: Inspect Ekko history bundle

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ekko-history.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official npm bundle without installing or running it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, tarfile, urllib.request
          version = '0.8.16'
          with urllib.request.urlopen('https://registry.npmjs.org/ekko-studio/' + version, timeout=60) as r:
              info = json.load(r)
          with urllib.request.urlopen(info['dist']['tarball'], timeout=120) as r:
              data = r.read()
          integrity = 'sha512-' + base64.b64encode(hashlib.sha512(data).digest()).decode()
          assert integrity == info['dist']['integrity'], 'npm integrity mismatch'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              text = archive.extractfile('package/dist/server/index.js').read().decode()
          report = {'version': version, 'integrity': integrity, 'bundle_sha256': hashlib.sha256(text.encode()).hexdigest()}
          excerpts = []
          for needle in ['function t8e(t){', 'function W8e(t){', 'function Frt(t,e,r={}){', 'skipped empty assistant message %s while loading session %s', 'skipped empty assistant message while building history for session %s']:
              positions = []
              offset = 0
              while (i := text.find(needle, offset)) >= 0:
                  positions.append(i)
                  offset = i + len(needle)
              report[needle] = positions
              for i in positions:
                  excerpts.append('\n--- ' + needle + ' ---\n' + text[max(0, i-9000):i+16000])
          output = json.dumps(report, indent=2) + '\n' + '\n'.join(excerpts)
          path = 'docs/ekko-history-0.8.16-inspection.txt'
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/contents/' + path
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          body = {'message': 'chore(ekko): record cloud inspection of npm 0.8.16 history bundle', 'content': base64.b64encode(output.encode()).decode(), 'branch': 'main'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as r:
                  body['sha'] = json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
          with urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(body).encode(), headers=headers, method='PUT'), timeout=60) as r:
              result = json.load(r)
          print('Inspection commit:', result['commit']['sha'])
          print(json.dumps(report, indent=2))
          PY
