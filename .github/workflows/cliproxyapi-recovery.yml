name: Verify fnpack fix and recover CLIProxyAPI release

# The authorized one-time recovery is complete. Future recoveries are explicit.
# Existing daily scheduling/release logic is unchanged.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 验证后发布到 FnDepot（同名资产按原流程覆盖）
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: cliproxyapi-recovery
  cancel-in-progress: false

jobs:
  regression-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 验证大帮助输出、真实失败码及空输出
        run: python3 scripts/test_fnpack_help.py
      - name: 仅触发 CLIProxyAPI 的现有构建发布流程
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$MANUAL_PUBLISH" == true ]]; then
            publish=true
          fi
          gh workflow run auto-build.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f app=cliproxyapi -f force=true -f dry_run=false -f publish="$publish"
          {
            echo '## CLIProxyAPI fnpack 修复回归'
            echo '- 大量帮助输出、真实失败码与空输出测试：通过'
            echo '- 已触发 Auto build fnOS FPK：app=cliproxyapi, force=true, dry_run=false'
            echo "- publish=$publish；实际构建/发布结果以新运行及 Release 资产为准"
          } >> "$GITHUB_STEP_SUMMARY"
