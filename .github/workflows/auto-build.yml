name: Auto build fnOS FPK

# 每天两轮检查上游更新（GitHub cron 为 UTC）：
#   02:05 UTC = 北京时间 10:05
#   14:05 UTC = 北京时间 22:05
# 只有检测到上游有新版本时才构建，构建产物推送到 cmbya/FnDepot 的日期 Release。
on:
  schedule:
    - cron: '5 2,14 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 指定应用 id（留空=全部；openlist / cliproxyapi / taosync / f2media / zjjx）
        required: false
        type: string
      force:
        description: 忽略「已发布」判断，强制重新构建
        required: false
        type: boolean
        default: false
      dry_run:
        description: 只检测不构建
        required: false
        type: boolean
        default: false
      publish:
        description: 是否把构建结果发布到 cmbya/FnDepot（默认发布；仅调试构建时设为 false）
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: auto-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      count: ${{ steps.check.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查上游更新
        id: check
        env:
          GH_TOKEN: ${{ secrets.FNDEPOT_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${{ inputs.app }}" ]]; then args+=(--app "${{ inputs.app }}"); fi
          if [[ "${{ inputs.force }}" == "true" ]]; then args+=(--force); fi
          python3 scripts/check_upstream.py "${args[@]}"

      - name: 汇总
        run: |
          echo "需要构建 ${{ steps.check.outputs.count }} 个应用"

  build:
    needs: check
    if: needs.check.outputs.count != '0' && inputs.dry_run != true
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.changed) }}
    uses: ./.github/workflows/build-app.yml
    with:
      app: ${{ toJSON(matrix.app) }}

  publish:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.outputs.count != '0' && inputs.dry_run != true && (inputs.publish == true || github.event_name != 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载全部构建产物
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: fpk-*
          merge-multiple: true

      - name: 列出产物
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ls -lh artifacts/ || true
          echo "fpk 数量：$(find artifacts -name '*.fpk' | wc -l)"

      - name: 发布到 FnDepot（按日期打 tag）
        env:
          GH_TOKEN: ${{ secrets.FNDEPOT_TOKEN }}
          TARGET_REPO: cmbya/FnDepot
        run: |
          set -euo pipefail
          shopt -s nullglob
          fpks=(artifacts/*.fpk)
          if (( ${#fpks[@]} == 0 )); then
            echo "没有 fpk 产物，跳过发布。"
            exit 0
          fi
          TAG="$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          echo "目标 Release tag: $TAG"
          echo "产物：${fpks[*]}"

          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加/覆盖资产。"
            gh release upload "$TAG" "${fpks[@]}" --repo "$TARGET_REPO" --clobber
          else
            gh release create "$TAG" "${fpks[@]}" \
              --repo "$TARGET_REPO" \
              --title "fnOS 应用构建 $TAG" \
              --notes "由 cmbya/fnos-buildbot 自动构建的 fnOS x86 原生 FPK。构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')。尚未完成真实设备安装回归测试，请自行验证后再用于正式环境。" \
            || gh release upload "$TAG" "${fpks[@]}" --repo "$TARGET_REPO" --clobber
          fi

          echo "=== 发布结果 ==="
          gh release view "$TAG" --repo "$TARGET_REPO" --json tagName,assets \
            --jq '.tagName, (.assets[] | "  " + .name + "  " + (.size|tostring))'

      - name: 触发 FnDepot 索引更新
        if: success()
        env:
          GH_TOKEN: ${{ secrets.FNDEPOT_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/cmbya/FnDepot/dispatches" \
            -f event_type=refresh-index \
          || {
            echo "repository_dispatch 失败，回退为 workflow_dispatch" >&2
            gh workflow run update-fndepot.yml --repo cmbya/FnDepot || {
              echo "触发索引更新失败（可稍后手动运行 FnDepot 的 Update FnDepot Source）" >&2
            }
          }
